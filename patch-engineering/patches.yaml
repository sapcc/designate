# patches.yaml — Downstream patch inventory for the SAP Designate fork
#
# This file is the authoritative registry of all downstream patches across releases.
# It answers questions that Git alone cannot reliably answer:
#   - Which commits belong to the same logical change?
#   - What dependencies exist between patches?
#   - What must be ported to the next release?
#   - What has been dropped or taken upstream?
#   - Which Alembic revisions belong to a patch?
#
# Update this file in the same PR whenever a patch is created, ported, or dropped.
# Status changes are always a side effect of a real PR, never a PR of their own:
# a patch flips from "pending" to "integrated" inside the porting PR itself.
# Every downstream code PR must reference a known patch ID.
#
# ─────────────────────────────────────────────────────────────────────────────
# TOP-LEVEL FIELDS
# ─────────────────────────────────────────────────────────────────────────────
#
#   schema_version  integer   Version of this file's schema. Currently 1.
#   patches         list      Ordered list of patch entries (see below).
#
# ─────────────────────────────────────────────────────────────────────────────
# PATCH ENTRY FIELDS
# ─────────────────────────────────────────────────────────────────────────────
#
#   id          string    Stable identifier, e.g. PATCH-023 or PATCH-001-F01.
#                         Stays constant across releases even if commits change.
#                         Fix patches use the suffix -F01, -F02, … and their
#                         dependency on the patched entry is listed in depends_on.
#
#   title       string    Short human-readable description of the patch.
#
#   depends_on  list      Patch IDs that must be integrated before this one.
#                         Covers both technical and fix relationships.
#                         [] means the patch is independent.
#                         A patch whose dependencies are not yet integrated in a
#                         release is implicitly blocked — no separate status needed.
#
#   upstream    object    Relationship to the upstream project.
#     .status   string    See UPSTREAM STATUS below.
#     .note     string    (optional) Free-text explanation, links, caveats.
#                         Document known overlap or discrepancies found during the
#                         last migration investigation so the next cycle has context.
#
#   releases    object    Per-release integration state.
#                         Keys are upstream version strings, e.g. "2024.2", "2026.2".
#     .<ver>.status       string    See RELEASE STATUS below.
#     .<ver>.commits      list      (optional) Commit SHAs on the integration branch.
#                                   Recorded for historical releases where squash-merge
#                                   SHAs were known at write time. For new releases,
#                                   commits are omitted — use
#                                   git log --oneline --grep="\[PATCH-NNN\]" instead.
#     .<ver>.migrations   list      (optional) Alembic revision IDs introduced by this
#                                   patch. Required when the patch adds a DB migration;
#                                   omit the field entirely when there is none.
#     .<ver>.pr           integer   (optional) Pull request number.
#
# ─────────────────────────────────────────────────────────────────────────────
# UPSTREAM STATUS
# ─────────────────────────────────────────────────────────────────────────────
#
#   downstream-only   No equivalent exists upstream; patch must always be ported.
#                     Use .note to document known overlap or caveats discovered
#                     during the last investigation.
#   upstreamed        Upstream contains an equivalent or identical change;
#                     patch can be dropped in the next migration cycle.
#
# ─────────────────────────────────────────────────────────────────────────────
# RELEASE STATUS
# ─────────────────────────────────────────────────────────────────────────────
#
#   pending      Patch has not yet been ported to this release (default).
#   integrated   Patch has been merged into the integration branch for this release.
#   dropped      Patch was intentionally not ported to this release.
#                If upstream.status is "upstreamed", no new release block is added
#                in future cycles — the patch is permanently closed.
#                If upstream.status is "downstream-only", re-evaluate next cycle.
#
# ─────────────────────────────────────────────────────────────────────────────

